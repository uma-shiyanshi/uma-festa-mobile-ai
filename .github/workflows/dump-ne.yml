name: "dump nativeengine trainings"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dump-ne.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dump
        run: |
          set +e
          mkdir -p ci
          F=app/app/src/main/java/com/ranko/matsuricapture/NativeEngine.kt
          {
            echo "# 行数: $(wc -l < $F)"
            echo "===== 600-680 ====="
            sed -n '600,680p' $F
            echo "===== gains 出现处 ====="
            grep -n "gains" $F | head -20
            echo "===== trainings.put 上下文 ====="
            grep -n -B6 -A6 "trainings.put" $F | head -40
          } > ci/ne-slice.txt 2>&1
          echo done
      - name: Commit
        run: |
          set +e
          git config user.name dsh-ci
          git config user.email dsh-ci@users.noreply.github.com
          git add -f ci/ne-slice.txt
          git commit -m "ci: dump NativeEngine trainings slice" || echo nothing
          git push origin HEAD:main || echo "push failed"