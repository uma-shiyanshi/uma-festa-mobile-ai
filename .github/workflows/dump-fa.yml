name: "dump frameadapter slice"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dump-fa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dump
        run: |
          set +e
          mkdir -p ci
          F=app/app/src/main/java/com/ranko/matsuricapture/FrameAdapter.kt
          {
            echo "# 行数: $(wc -l < $F)"
            echo "===== 330-470（base 组装段）====="
            sed -n '330,470p' $F
            echo "===== cardId 相关 ====="
            grep -n -e 'put("cardId' -e 'cardIds' -e 'cardPlain' -e '"cardId"' -e 'fiveStatus' -e 'fiveStatusLimit' -e 'scenarioId' $F
            echo "===== 引擎期望的关键键（对照 base.rs）====="
            echo "scenarioId umaId turn vital maxVital motivation fiveStatus fiveStatusLimit skillPt skillScore totalHints trainLevelCount ptScoreRate failureRateBias isIll isQieZhe isAiJiao PositiveThinkingCount LuckyCount zhongMaBlueCount isRacing cardId persons personDistribution lockedTrainingId friend_stage friend_outgoingUsed"
          } > ci/fa-slice.txt 2>&1
          echo done
      - name: Commit
        run: |
          set +e
          git config user.name dsh-ci
          git config user.email dsh-ci@users.noreply.github.com
          git add -f ci/fa-slice.txt
          git commit -m "ci: dump FrameAdapter base 组装段" || echo nothing
          git push origin HEAD:main || echo "push failed"