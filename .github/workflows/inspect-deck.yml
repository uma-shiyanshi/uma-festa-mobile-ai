name: "inspect deck rule"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-deck.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Clone upstream
        run: |
          set +e
          git clone --depth 1 https://github.com/umaai-project/umaai-matsuri.git /tmp/up
      - name: Report
        run: |
          set +e
          mkdir -p ci
          {
            echo "# 引擎里含「编成」的错误文本"
            grep -rn "编成" /tmp/up/crates 2>/dev/null | head -40
            echo
            echo "# 引擎里含 deck/卡组 校验的错误文本"
            grep -rn -e "卡组" -e "deck" /tmp/up/crates/matsuri-core/src/game/restore.rs 2>/dev/null | head -40
            echo
            echo "# restore.rs 里所有 bail!/ensure! 文本"
            grep -rn -E "bail!|ensure!|anyhow!" /tmp/up/crates/matsuri-core/src/game/restore.rs 2>/dev/null | head -40
            echo
            echo "# 上游 data/matsuri_config.toml 的档名"
            grep -n "^\[decks" /tmp/up/data/matsuri_config.toml 2>/dev/null | head -20
            echo
            echo "# 上游 constants: five_status_limit_base"
            python3 -c "import json;d=json.load(open('/tmp/up/data/constants.json'));print(d.get('five_status_limit_base'),d.get('pt_score_rate'))" 2>/dev/null
          } > ci/inspect-deck.txt 2>&1
          echo done
      - name: Commit
        run: |
          set +e
          git config user.name dsh-ci
          git config user.email dsh-ci@users.noreply.github.com
          git add -f ci/inspect-deck.txt
          git commit -m "ci: inspect deck rule v2 (upstream)" || echo nothing
          git push origin HEAD:main || echo "push failed"