name: Sync ai-engine
# touch: 2026-11-08T22:16+08:00 触发同步（上游 4bc0e653 fcthreads/期望分投影/运气分）
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-ai-engine2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Mirror upstream and commit
        run: |
          set -e
          git clone --depth 1 https://github.com/umaai-project/umaai-matsuri.git /tmp/up
          cd /tmp/up
          SHA=$(git rev-parse HEAD)
          MSG=$(git log -1 --format='%h %s')
          # [APP-SYNC-118] 上游 umaai-next 已改为仓内 submodule，按 gitlink 钉住 sha 同步引擎仓快照
          SUB_SHA=$(git ls-tree HEAD umaai_next | awk '{print $3}')
          if ! git submodule update --init --depth 1 umaai_next; then
            rm -rf umaai_next
            git clone --no-checkout --filter=blob:none https://github.com/umaai-project/umaai-next.git umaai_next
            git -C umaai_next checkout "$SUB_SHA" || {
              # [APP-SYNC-119] 悬空 gitlink 兜底：钉住 sha 上游不可达时回落 umaai-next main HEAD
              echo "::warning::pinned umaai_next=$SUB_SHA 上游不存在（悬空 gitlink），回落 umaai-next main HEAD"
              rm -rf umaai_next
              git clone --depth 1 https://github.com/umaai-project/umaai-next.git umaai_next
            }
          fi
          echo "resolved umaai_next=$(git -C umaai_next rev-parse HEAD)"
          SUB_MSG=$(git -C umaai_next log -1 --format='%h %s')
          cd "$GITHUB_WORKSPACE"
          rm -rf ai-engine/umaai-matsuri
          mkdir -p ai-engine/umaai-matsuri
          cp -a /tmp/up/. ai-engine/umaai-matsuri/
          rm -rf ai-engine/umaai-matsuri/.git ai-engine/umaai-matsuri/target ai-engine/umaai-matsuri/umaai_next
          rm -f ai-engine/umaai-matsuri/data/*.json ai-engine/umaai-matsuri/data/*.mdb
          rm -rf ai-engine/umaai_next
          mkdir -p ai-engine/umaai_next
          cp -a /tmp/up/umaai_next/. ai-engine/umaai_next/
          rm -rf ai-engine/umaai_next/.git ai-engine/umaai_next/target
          find ai-engine/umaai-matsuri -type f | wc -l
          find ai-engine/umaai_next -type f | wc -l
          printf '%s\n' "# ai-engine 上游同步" "" "- 上游 https://github.com/umaai-project/umaai-matsuri" "- commit $SHA" "- 最近提交 $MSG" "- 引擎仓 https://github.com/umaai-project/umaai-next（submodule 钉住）" "- commit $SUB_SHA" "- 最近提交 $SUB_MSG" "- 说明：手机端 App 是 Kotlin+WebView JS，不能直接运行本 Rust 引擎；此目录用于对照规则与移植。" > ai-engine/UPSTREAM_SYNC.md
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add -A ai-engine
          git commit -m "chore(ai-engine): sync upstream umaai-matsuri + umaai_next@$SUB_SHA" || echo "nothing to commit"
          git push || echo "push failed"