name: "verify skills_live wiring"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-skills.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          set +e
          mkdir -p ci
          {
            echo "# lib.rs 里 skills_live 相关行"
            grep -n "skills_resp\|skills_live" so/hachimi_ura_plugin/src/lib.rs | head -20
            echo
            echo "# mod 声明位置前后"
            grep -n -B3 -A3 "mod skills_resp" so/hachimi_ura_plugin/src/lib.rs | head -20
            echo
            echo "# 构建产物里的字面量"
            for s in "/api/skills_live" "skill_upgrade_info_array" "/api/prefix"; do
              printf "%-28s " "$s"
              grep -c "$s" so/dist/libhachimi_ura-3.29.8-skillptspent.so 2>/dev/null || echo "(grep 不可用)"
            done
            echo
            echo "# so/dist 列表"
            ls -l so/dist | tail -5
          } > ci/verify-skills.txt 2>&1
          echo done
      - name: Commit
        run: |
          set +e
          git config user.name dsh-ci
          git config user.email dsh-ci@users.noreply.github.com
          git add -f ci/verify-skills.txt
          git commit -m "ci: verify skills_live wiring" || echo nothing
          git push origin HEAD:main || echo "push failed"